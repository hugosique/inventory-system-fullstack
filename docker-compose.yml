services:
  db:
    image: postgres:15
    container_name: inventory_db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: inventory_api
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: inventory_web
    restart: always
    environment:
      VITE_API_PROXY_TARGET: http://backend:3333
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
